plugins {
    id 'com.android.application'
}

android {
    namespace 'ua.kotelnia.pokaznyky'
    compileSdk 34

    defaultConfig {
        applicationId 'ua.kotelnia.pokaznyky'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.1-demo'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
